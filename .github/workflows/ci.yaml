name: CI

on:
  push:
    branches: "*"
  pull_request:
    branches: main

permissions:
  contents: read

# Cancel superseded runs of the same pull request. Every push gets its own
# group, so all pushed commits are tested and nothing is serialized; the
# deploy job serializes GitHub Pages deployments on its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.python-version }}-posix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        python-version: ['3.11']
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true
        fetch-depth: 0
        fetch-tags: true

    - name: Setup Miniconda
      uses: mamba-org/setup-micromamba@v1
      with:
        cache-downloads: true
        condarc: |
          channels:
            - conda-forge
        create-args: |
          python=${{ matrix.python-version }}
        environment-name: FES
        environment-file: conda/environment.yml

    - name: Compile and Testing Python Package
      shell: bash -l {0}
      run: |
        python setup.py build
        pytest -q -ra

    - name: Build C++ Library and Testing
      shell: bash -l {0}
      run: |
        mkdir build
        cd build
        cmake .. -DFES_ENABLE_TEST=ON
        make -j 2
        ctest

    - name: Generate Documentation
      shell: bash -l {0}
      run: |
        sphinx-build -b html docs/source docs/build

    - name: Upload artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/build

  win:
    name: win
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        lfs: true

    - name: Setup Miniconda
      uses: mamba-org/setup-micromamba@v1
      with:
        cache-downloads: true
        condarc: |
          channels:
            - conda-forge
        create-args: |
          python=3.11
        environment-name: FES
        environment-file: conda/environment.yml

    # - name: Test pip install from GitHub
    #   shell: bash -l {0}
    #   run: |
    #     pip install --force-reinstall "git+https://github.com/CNES/aviso-fes.git"

    - name: Building Testing Python Package
      shell: bash -l {0}
      run: |
        python setup.py build_ext --generator="Visual Studio 17 2022"
        python setup.py build
        pytest -q -ra

  # Publish the documentation built by the linux job. Pull requests never reach
  # this job: fork PRs cannot obtain the Pages/OIDC permissions it requires.
  deploy:
    name: deploy-docs
    needs: linux
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Run one deployment at a time and never interrupt one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
