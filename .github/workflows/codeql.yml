name: CodeQL

on:
  push:
    branches: main
  pull_request:
    branches: main
  # Rescan weekly to catch the queries added to CodeQL since the last push.
  schedule:
    - cron: '27 4 * * 1'

permissions: {}

jobs:
  analyze:
    name: analyze-${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Upload the results to the Security tab of the repository.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # C++ is analyzed without a build: CodeQL would otherwise need Boost
        # and Eigen. The third-party submodules are not checked out.
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: python
            build-mode: none

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: /language:${{ matrix.language }}
